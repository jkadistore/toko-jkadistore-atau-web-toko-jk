<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07091a">
<meta name="description" content="JK AdiStore — MLBB, VPN, Aplikasi, Digital Store & AI">
<title>JK AdiStore</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:auto}

body{
 margin:0;
 font-family:system-ui,-apple-system,Segoe UI,sans-serif;
 background:#050716;
 color:#fff;
 min-height:100vh;
 background-image:
 radial-gradient(circle at 10% 10%,#ff00c822,transparent 30%),
 radial-gradient(circle at 90% 20%,#00e5ff1d,transparent 30%),
 radial-gradient(circle at 50% 90%,#8b5cf622,transparent 35%);
}

body:before{
 content:"";
 position:fixed;
 inset:-50%;
 z-index:-1;
 background:conic-gradient(
  #ff00c814,#ffe60010,#00e5ff14,
  #5b5cff12,#ff00c814
 );
 filter:blur(55px);
 animation:none;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

@keyframes rainbow{
 0%,100%{background-position:0% 50%}
 50%{background-position:100% 50%}
}

@keyframes tickerMove{
 from{transform:translateX(0)}
 to{transform:translateX(-33.3333%)}
}

@keyframes rainbowBlink{
 0%,100%{opacity:1;filter:brightness(1)}
 45%{opacity:.72;filter:brightness(1.35)}
 50%{opacity:.25;filter:brightness(1.8)}
 55%{opacity:1;filter:brightness(1.15)}
}

.top-ticker{
 width:100%;
 overflow:hidden;
 margin-bottom:18px;
 border:1px solid #ffffff18;
 border-radius:14px;
 background:#00000022;
 box-shadow:0 0 24px #ff00c822;
}

.top-ticker-track{
 display:flex;
 width:max-content;
 min-width:max-content;
 padding:9px 0;
 font-size:clamp(14px,2.8vw,20px);
 font-weight:950;
 letter-spacing:1px;
 animation:tickerMove 32s linear infinite;
 will-change:transform;
}

.top-ticker-text{
 display:block;
 flex:0 0 auto;
 padding:0 28px;
 background:linear-gradient(90deg,#ff00c8,#ff3d00,#ffe600,#00ff99,#00e5ff,#5b5cff,#ff00c8);
 background-size:500% 100%;
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
 animation:rainbow 5s linear infinite;
}

.hero-title-row{
 display:flex; align-items:center; justify-content:flex-start; gap:clamp(24px,5vw,64px);
 flex-wrap:nowrap; margin:4px 0 10px; width:100%;
}
.hero-title-row h1{margin:0!important; flex:0 1 auto;}
.store-clock{
 flex:0 0 auto; display:flex; align-items:center; justify-content:center;
 min-height:64px; padding:8px 16px; border:1px solid #ffffff30; border-radius:18px;
 background:linear-gradient(135deg,#ff00c81a,#5b5cff18,#00e5ff18);
 box-shadow:0 0 30px #ff00c82c,inset 0 0 22px #ffffff08; overflow:hidden;
}
.store-clock .clock-time{display:inline-block; font-size:clamp(30px,6vw,54px); line-height:1; font-weight:1000; letter-spacing:2px;
 background:linear-gradient(90deg,#ff00c8,#ff3d00,#ffe600,#00ff99,#00e5ff,#5b5cff,#ff00c8);
 background-size:600% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
 animation:rainbow 4s linear infinite,rainbowBlink 2.6s ease-in-out infinite; text-shadow:0 0 18px #ff00c855}
@media(max-width:700px){
 .top .brand img{width:38px!important;height:38px!important}
 .hero-card img{width:60px!important;height:60px!important}
 .hero-title-row{gap:16px; align-items:center}
 .hero-title-row h1{font-size:clamp(38px,10vw,58px)!important}
 .store-clock{min-height:54px;padding:7px 11px;border-radius:15px}
 .store-clock .clock-time{font-size:clamp(22px,6.5vw,36px);letter-spacing:1px}
}
.top .brand img{width:42px!important;height:42px!important;object-fit:cover;border-radius:12px}
.hero-card img{width:74px!important;height:74px!important;object-fit:cover;border-radius:16px}
@media(max-width:700px){.top .brand img{width:38px!important;height:38px!important}.hero-card img{width:60px!important;height:60px!important}.store-clock{min-height:64px;padding:8px 12px}}

.rainbow{
 background:linear-gradient(
  90deg,#ff00c8,#5b5cff,#00e5ff,
  #ffe600,#ff3d00,#ff00c8
 );
 background-size:400% 400%;
 animation:rainbow 9s ease infinite;
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
}

.wrap{
 width:min(1180px,94%);
 margin:auto;
}

.top{
 position:sticky;
 top:0;
 z-index:30;
 background:#050716dd;
 backdrop-filter:blur(16px);
 border-bottom:1px solid #ffffff1c;
}

.nav{
 min-height:68px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.brand{
 display:flex;
 gap:10px;
 align-items:center;
 font-weight:900;
 border:0;
 background:none;
 color:#fff;
 cursor:pointer;
}

.brand img{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #00e5ff;
}

.navlinks{
 display:flex;
 gap:7px;
 align-items:center;
}

button,.btn{
 border:1px solid #ffffff1b;
 background:#ffffff0c;
 color:#fff;
 border-radius:12px;
 padding:10px 13px;
 font-weight:800;
 cursor:pointer;
}

button:hover,.btn:hover{
 background:#ffffff16;
}

.primary{
 border:0;
 background:linear-gradient(100deg,#ff00c8,#5b5cff,#00e5ff);
}

.hero{
 padding:14px 0 60px;
}

.hero-grid{
 display:grid;
 grid-template-columns:1.25fr .75fr;
 gap:25px;
 align-items:center;
}

.hero h1{
 font-size:clamp(45px,8vw,80px);
 line-height:.9;
 margin:15px 0;
}

.hero-card,.card,.panel{
 background:#0c1227dd;
 border:1px solid #ffffff16;
 border-radius:20px;
 box-shadow:0 20px 70px #0005;
}

.hero-card{
 padding:18px;
}

.hero-card img{
 width:100%;
 aspect-ratio:1.3;
 object-fit:cover;
 border-radius:15px;
}

.muted{
 color:#aeb7d4;
}

.marquee{
 overflow:hidden;
 border-block:1px solid #ffffff15;
 white-space:nowrap;
}

.track{
 display:inline-block;
 padding:12px;
 font-weight:900;
 animation:marquee 25s linear infinite;
}

.track span{
 margin:0 35px;
}

@keyframes marquee{
 to{transform:translateX(-50%)}
}

section{
 padding:30px 0;
}

#shop{
 scroll-margin-top:82px;
}

.head{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:12px;
 margin-bottom:15px;
}

.head h2{
 margin:0;
}

.input,.select,.area{
 width:100%;
 padding:12px;
 border-radius:11px;
 border:1px solid #ffffff19;
 background:#0007;
 color:#fff;
 outline:none;
}

.input:focus,.area:focus,.select:focus{
 border-color:#00e5ff;
 box-shadow:0 0 15px #00e5ff22;
}

.area{
 min-height:120px;
 resize:vertical;
}

.search{
 max-width:300px;
}

.chips{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin:12px 0;
 position:relative;
 z-index:5;
}

.chip{
 border:1px solid #ffffff18;
 background:#ffffff09;
 color:#fff;
 padding:8px 11px;
 border-radius:99px;
 cursor:pointer;
 pointer-events:auto;
 touch-action:manipulation;
 -webkit-tap-highlight-color:transparent;
}

.chip.active{
 background:#5b5cff55;
 border-color:#5b5cff;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:14px;
 align-items:stretch;
 grid-auto-rows:auto;
}

/* Layout-only fix: make each product row stretch evenly. */
.grid > .card{
 align-self:stretch;
 min-height:100%;
}

.grid > .card .body{
 height:100%;
 box-sizing:border-box;
}

.card{
 overflow:hidden;
 transition:.2s;
 height:100%;
 min-width:0;
 display:flex;
 flex-direction:column;
}

.card:hover{
 transform:translateY(-4px);
 border-color:#00e5ff44;
 box-shadow:0 15px 50px #0008;
}

.pic{
 width:100%;
 aspect-ratio:1 / 1;
 object-fit:cover;
 display:block;
 flex:0 0 auto;
}

.body{
 padding:14px;
 display:flex;
 flex-direction:column;
 flex:1;
 min-width:0;
 min-height:220px;
}

.body h3{
 min-height:2.5em;
 line-height:1.25;
 margin:10px 0 8px;
 overflow-wrap:anywhere;
}

.body > .muted{
 min-height:3em;
 line-height:1.45;
 overflow-wrap:anywhere;
}

.badge{
 font-size:11px;
 color:#ff8ee6;
 background:#ff00c81b;
 padding:4px 7px;
 border-radius:7px;
}

.price{
 font-size:20px;
 font-weight:900;
 margin:8px 0;
}

.old{
 text-decoration:line-through;
 color:#737b9c;
 font-size:12px;
 margin-left:5px;
}

.stock{
 font-size:12px;
 color:#75ffc0;
}

.actions{
 display:flex;
 gap:7px;
 margin-top:auto;
 padding-top:12px;
}

.actions .btn{
 flex:1;
 min-height:44px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
}

.pillrow{
 display:flex;
 gap:10px;
 overflow:auto;
}

.pill{
 min-width:130px;
 padding:15px;
 border-radius:14px;
 background:#ffffff08;
 border:1px solid #ffffff15;
 font-weight:900;
}

.modal{
 position:fixed;
 inset:0;
 background:#000c;
 backdrop-filter:blur(9px);
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:16px;
}

.modalbox{
 width:min(700px,100%);
 max-height:92vh;
 overflow:auto;
 background:#090d20;
 border:1px solid #ffffff1b;
 border-radius:20px;
 padding:20px;
}

.modalhead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.formgrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.full{
 grid-column:1/-1;
}

.label{
 display:block;
 font-size:12px;
 color:#b9c2df;
 margin:10px 0 5px;
}

.order{
 padding:13px;
 border:1px solid #ffffff15;
 border-radius:13px;
 margin:8px 0;
 background:#ffffff06;
}

.adminGrid{
 display:grid;
 grid-template-columns:220px 1fr;
 gap:15px;
}

.side{
 padding:10px;
 height:max-content;
 position:sticky;
 top:83px;
}

.side button{
 width:100%;
 text-align:left;
 border:0;
 background:transparent;
 color:#bac2df;
 padding:11px;
 border-radius:10px;
}

.side button.active,
.side button:hover{
 background:#ffffff0c;
 color:#fff;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
}

.stat{
 padding:17px;
 border:1px solid #ffffff16;
 border-radius:15px;
 background:#0c1227d9;
}

.stat b{
 display:block;
 font-size:27px;
 margin-top:6px;
}

.tablewrap{
 overflow:auto;
 border:1px solid #ffffff16;
 border-radius:15px;
}

.table{
 width:100%;
 border-collapse:collapse;
}

.table th,.table td{
 padding:11px;
 border-bottom:1px solid #ffffff14;
 text-align:left;
 font-size:13px;
}

.toast{
 position:fixed;
 right:15px;
 bottom:15px;
 z-index:200;
 background:#10162d;
 border:1px solid #ffffff1b;
 padding:13px 16px;
 border-radius:12px;
}

.ai-box{
 background:
 linear-gradient(135deg,#5b5cff18,#ff00c818,#00e5ff10);
 border:1px solid #ffffff18;
 border-radius:20px;
 padding:20px;
}

.ai-message{
 padding:12px;
 border-radius:13px;
 background:#ffffff08;
 margin:8px 0;
 white-space:pre-wrap;
}

.ai-user{
 border-left:3px solid #00e5ff;
}

.ai-bot{
 border-left:3px solid #ff00c8;
}

.ai-lock{
 text-align:center;
 padding:25px;
}

.warning{
 color:#ffd166;
 font-size:13px;
}

.price-list{
 display:grid;
 gap:9px;
 margin-top:15px;
}

.price-item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:12px;
 border:1px solid #ffffff14;
 background:#ffffff06;
 border-radius:13px;
}

.price-item b{
 color:#fff;
}

.price-item span{
 color:#75ffc0;
 font-weight:900;
}

.product-detail-img{
 width:100%;
 max-height:300px;
 object-fit:cover;
 border-radius:15px;
 margin-bottom:15px;
}

.detail-actions{
 display:flex;
 gap:8px;
 margin-top:15px;
}

.detail-actions>*{
 flex:1;
}

.option-select{
 margin-top:10px;
}

.category-banner{
 padding:18px;
 border:1px solid #ffffff14;
 border-radius:18px;
 margin-bottom:15px;
 background:
 linear-gradient(135deg,#5b5cff16,#ff00c816);
}

.hidden{
 display:none!important;
}

.bottom{
 display:none;
}

.quick-menu{margin-top:22px}
.quick-menu-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick-menu-card{border:1px solid #ffffff16;background:linear-gradient(135deg,#ff00c81a,#5b5cff18,#00e5ff12);color:#fff;border-radius:16px;padding:16px;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 10px 30px #0005}
.quick-menu-card:hover{transform:translateY(-2px);border-color:#00e5ff55}
.quick-menu-card b{display:block;font-size:15px}
.quick-menu-card small{display:block;color:#b8bfd7;margin-top:3px;font-size:12px}
.quick-icon{font-size:28px;flex:0 0 auto}
@media(max-width:900px){.quick-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media(max-width:520px){
 .wrap{
  width:min(100% - 20px,1180px);
 }
 .card h3{
  font-size:14px;
  line-height:1.25;
 }
 .muted{
  line-height:1.4;
 }
.quick-menu-card{padding:12px}.quick-menu-card small{font-size:10px}.quick-icon{font-size:24px}}

.footer{
 padding:40px 0 70px;
 color:#9099b8;
 border-top:1px solid #ffffff15;
}

@media(max-width:900px){

 .hero-grid,.adminGrid{
  grid-template-columns:1fr;
 }

 .grid{
  grid-template-columns:repeat(2,1fr);
 }

 .nav{
  align-items:flex-start;
  padding:8px 0;
 }

 .navlinks{
  display:flex;
  overflow-x:auto;
  max-width:100%;
  padding-bottom:4px;
  scrollbar-width:none;
 }

 .navlinks::-webkit-scrollbar{
  display:none;
 }

 .navlinks button{
  flex:0 0 auto;
  white-space:nowrap;
  padding:8px 10px;
  font-size:12px;
 }

 .bottom{
  position:fixed;
  display:flex;
  bottom:0;
  left:0;
  right:0;
  background:#050716ee;
  z-index:50;
  padding:7px;
  border-top:1px solid #ffffff16;
 }

 .bottom button{
  flex:1;
  background:none;
  border:0;
  color:#bbc4df;
  font-size:11px;
 }

 .stats{
  grid-template-columns:repeat(2,1fr);
 }

}

@media(max-width:520px){

 .formgrid{
  grid-template-columns:1fr;
 }

 .full{
  grid-column:auto;
 }

 .hero{
  padding-top:35px;
 }

 .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  align-items:stretch;
 }

 .body{
  padding:10px;
  min-height:205px;
 }

 .body h3{
  min-height:2.5em;
 }

 .body > .muted{
  min-height:3em;
 }

 .actions{
  gap:6px;
 }

 .actions .btn{
  min-height:42px;
  padding:9px 8px;
 }

 .price{
  font-size:17px;
 }

 .detail-actions{
  flex-direction:column;
 }

}
img{background:#080d1f}
.pic img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto;}
</style>
<style>
.game-products {
  padding: 30px 16px;
  color: #fff;
}

.game-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 25px;
}

.game-header > span {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 15px;
  background: linear-gradient(135deg, #6d28d9, #ec4899);
  font-size: 25px;
}

.game-header h2 {
  margin: 0;
  font-size: 25px;
}

.game-header p {
  margin: 5px 0 0;
  color: #a9afd0;
  font-size: 14px;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 18px;
}

.game-card {
  background: rgba(14, 18, 42, .94);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.game-card-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.game-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: linear-gradient(135deg,#242a5c,#701a75);
}

.game-card h3 {
  margin: 0;
  font-size: 17px;
}

.game-card small {
  color: #9299bd;
}

.package-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.package-item {
  width: 100%;
  border: 1px solid rgba(255,255,255,.07);
  background: #12162d;
  color: #fff;
  padding: 13px 14px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: .2s ease;
  text-align: left;
}

.package-item:hover {
  transform: translateY(-2px);
  border-color: #8b5cf6;
  background: #181d3b;
}

.package-name {
  font-size: 14px;
  font-weight: 600;
}

.package-price {
  color: #65f7b1;
  font-weight: 800;
  font-size: 13px;
}

/* MODAL */
.game-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 99999;
}

.game-modal.active {
  display: flex;
}

.game-modal-box {
  width: min(430px, 100%);
  background: #090d21;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 22px;
  padding: 25px;
  position: relative;
  box-shadow: 0 25px 80px rgba(0,0,0,.55);
  animation: modalIn .2s ease;
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: scale(.94) translateY(10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.modal-close {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 35px;
  height: 35px;
  border: 0;
  border-radius: 10px;
  background: #181d35;
  color: #fff;
  font-size: 23px;
  cursor: pointer;
}

.modal-icon {
  font-size: 42px;
  margin-bottom: 8px;
}

.game-modal-box h2 {
  margin: 0;
  font-size: 24px;
}

.modal-subtitle {
  color: #8e96bb;
  margin: 5px 0 20px;
}

.modal-package {
  background: linear-gradient(135deg,#151a38,#20113d);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 15px;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-package span {
  display: block;
  color: #858cac;
  font-size: 12px;
  margin-bottom: 5px;
}

.modal-package strong {
  font-size: 16px;
}

.modal-price {
  color: #66f5b2;
  font-size: 18px;
  font-weight: 900;
}

.modal-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 15px 0;
}

.modal-info div {
  background: #11162e;
  border-radius: 10px;
  padding: 10px;
  color: #b7bdd9;
  font-size: 12px;
}

.modal-info div:last-child {
  grid-column: span 2;
}

.buy-button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 14px;
  color: #fff;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  background: linear-gradient(90deg,#ec0ab8,#7355ff,#00cfff);
  background-size: 200% 100%;
  animation: gradientMove 3s linear infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

@media(max-width:600px) {
  .game-grid {
    grid-template-columns: 1fr;
  }

  .game-modal-box {
    padding: 20px;
  }
}

.qr-payment{
 text-align:center;
}
.qr-payment img{
 display:block;
 width:min(320px,100%);
 aspect-ratio:1/1;
 object-fit:contain;
 margin:14px auto;
 padding:12px;
 background:#fff;
 border-radius:18px;
 border:1px solid #ffffff22;
}

/* =========================================================
   DAILY STOCK
   Tampilan stok berubah otomatis setiap hari.
   Ini BUKAN stok database nyata.
   ========================================================= */

function dailyNumber(id,min=800,max=10000){

 const now=new Date();

 const day=
  now.getFullYear()+"-"+
  (now.getMonth()+1)+"-"+
  now.getDate();

 const str=String(id)+day;

 let hash=0;

 for(let i=0;i<str.length;i++){
  hash=
   ((hash<<5)-hash)+
   str.charCodeAt(i);

  hash|=0;
 }

 hash=Math.abs(hash);

 return min+
  (hash%(max-min+1));
}


function displayStock(p){
 let min=Number(p?.stockMin), max=Number(p?.stockMax);
 if(!Number.isFinite(min)) min=800;
 if(!Number.isFinite(max)) max=10000;
 min=Math.max(800,Math.floor(min));
 max=Math.max(min,Math.floor(max));
 return dailyNumber(p?.id||"product",min,max);
}

 String(s??"").replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[c])
 );

function toast(message){

 const t=
  document.querySelector("#toast");

 t.textContent=message;

 window.toastTimer=setTimeout(()=>{
  t.classList.add("hidden");
 },3000);
}

function jumpToInitialMenu(){
 if(initialMenuJumpDone || !products.length) return;
 const menu=document.querySelector("#quickMenu");
 if(!menu) return;
 initialMenuJumpDone=true;
 window.scrollTo({
  top:Math.max(0,menu.getBoundingClientRect().top+window.scrollY-8),
  behavior:"auto"
 });
}


async function load(){
  try{
    const snap=await getDocs(collection(db,"products"));
    const localProducts=snap.docs.map(d=>({id:d.id,...d.data()}));
    const normalizeMenuCategory=p=>{const name=String(p?.name||"").toUpperCase();if(name.includes("AKUN WARLIT"))return "AKUN WARLIT NEW/OFF";if(name.includes("RW MLBB"))return "RW/DK X JKAdiStore";if(name.includes("RANK VS BOT"))return "RENK VS BOT NEW";return p?.category};
    const uniqueProducts=new Map();[...fallback,...localProducts].forEach(raw=>{const p={...raw,category:normalizeMenuCategory(raw)};const mapped=brandImage(String(p?.id||""));if(mapped)p.image=mapped;const key=String(p?.name||p?.id||"").toLowerCase().replace(/[^a-z0-9]+/g,"").trim();if(key)uniqueProducts.set(key,p)});products=[...uniqueProducts.values()];
  }catch(e){products=fallback}
  render();setTimeout(jumpToInitialMenu,50)
}

function jkAuthMessage(msg){const e=document.getElementById("jkAuthError");if(e)e.textContent=msg||""}
window.jkAuthTab=function(tab){const login=tab==="login";document.getElementById("jkLoginForm")?.classList.toggle("active",login);document.getElementById("jkRegisterForm")?.classList.toggle("active",!login);document.getElementById("jkTabLogin")?.classList.toggle("active",login);document.getElementById("jkTabRegister")?.classList.toggle("active",!login);jkAuthMessage("")}
window.jkLocalLogin=()=>{
  try{
    const email=String(document.getElementById("jkLoginEmail")?.value||"").trim().toLowerCase();
    const password=String(document.getElementById("jkLoginPassword")?.value||"");
    if(!email || !password) return jkAuthMessage("Email dan password wajib diisi.");

    // Read every supported local account location. Older versions of the
    // project used a single account; newer/legacy admin data may use a
    // separate key or an accounts array. Preserve all of them.
    const accounts=[];
    const readJSON=(key)=>{ try{return JSON.parse(localStorage.getItem(key)||"null");}catch(e){return null;} };
    const one=readJSON("jk_local_account");
    const adminOne=readJSON("jk_admin_account");
    const many=readJSON("jk_local_accounts");
    if(one && typeof one==="object") accounts.push(one);
    if(adminOne && typeof adminOne==="object") accounts.push({...adminOne,role:adminOne.role||"admin"});
    if(Array.isArray(many)) accounts.push(...many.filter(x=>x&&typeof x==="object"));

    // De-duplicate by email and keep the first complete record.
    const byEmail=new Map();
    for(const a of accounts){
      const k=String(a.email||"").trim().toLowerCase();
      if(k && !byEmail.has(k)) byEmail.set(k,a);
    }
    const saved=byEmail.get(email);

    if(!saved){
      return jkAuthMessage("Akun belum terdaftar. Silakan DAFTAR terlebih dahulu.");
    }
    if(String(saved.password||"")!==password){
      return jkAuthMessage("Email atau password tidak sesuai.");
    }

    const role=String(saved.role||"user").toLowerCase();
    admin=(role==="admin" || role==="administrator" || saved.isAdmin===true);
    user={
      uid:String(saved.uid || (admin ? "admin_" : "user_")+Date.now().toString(36)),
      name:(saved.name || email.split("@")[0] || "Pengguna"),
      email,
      whatsapp:saved.whatsapp || "",
      role:admin?"admin":"user"
    };
    window.user=user;

    // Keep a small session record so every menu/button knows who is signed in.
    try{
      sessionStorage.setItem("jk_formal_login","1");
      sessionStorage.setItem("jk_login_role",admin?"admin":"user");
      localStorage.setItem("jk_session_uid",user.uid);
    }catch(e){}

    document.body.classList.remove("jk-locked");
    document.getElementById("jkAuthGate")?.classList.add("hidden");

    try{ if(typeof render==="function") render(); }catch(err){ console.error("Store render error:",err); }
    setTimeout(()=>{
      try{ if(typeof jumpToInitialMenu==="function") jumpToInitialMenu(); }catch(err){}
    },50);
    if(typeof toast==="function") toast(admin?"Login admin berhasil":"Login berhasil");
  }catch(e){
    console.error("jkLocalLogin error:",e);
    jkAuthMessage(e?.message||"Login gagal");
  }
};

window.jkLocalRegister=async()=>{
  try{
    const name=String(document.getElementById("jkRegName")?.value??"").trim();
    const whatsapp=String(document.getElementById("jkRegWA")?.value??"").trim();
    const email=String(document.getElementById("jkRegEmail")?.value??"").trim();
    const password=String(document.getElementById("jkRegPassword")?.value??"");

    if(!name||!whatsapp||!email||!password){
      return jkAuthMessage("Isi semua kolom terlebih dahulu");
    }

    // Register only creates a normal customer account. It never overwrites
    // an existing admin record.
    const normalizedEmail=email.toLowerCase();
    let existing=null;
    try{ existing=JSON.parse(localStorage.getItem("jk_local_account")||"null"); }catch(e){}
    if(existing?.email && String(existing.email).trim().toLowerCase()===normalizedEmail){
      return jkAuthMessage("Email sudah terdaftar. Silakan LOGIN.");
    }
    try{

 const prices=getPriceOptions(p);
 const index=Math.min(Math.max(Number(optionIndex)||0,0),prices.length-1);

 const existing=cart.find(x=>x.id===key);

 else cart.push({id:key,productId:p.id,optionIndex:index,name:`${p.name} — ${selected.name}`,price:selected.price,qty:1});
 save(); toast(`${selected.name} masuk keranjang`); render();
};

window.unlockAI=async()=>{

 if(aiLocked)
  return;


 const key=
  document.querySelector("#aikey")?.value;


 if(!key)
  return toast(
   "Masukkan kunci AI"
  );


 try{

  const token=
   await user.getIdToken();


  const response=
   await fetch(
    "/api/ai/unlock",
    {
     method:"POST",

     headers:{
      "Content-Type":
       "application/json",

      "Authorization":
       "Bearer "+token
     },

     body:JSON.stringify({
      key
     })
    }
   );


  const data=
   await response.json();


  if(
   response.ok&&
   data.ok
  ){

   aiUnlocked=true;
   aiAttempts=0;

   closeM();

   aiPage();

   return;

  }


  aiAttempts++;


  if(
   data.locked||
   aiAttempts>=5
  ){

   aiLocked=true;

   closeM();


   return modal(
    "AI Dikunci",

    `
    <div class="ai-lock">

     <h2>
      🔒 TERKUNCI
     </h2>

     <p class="muted">
      Lima percobaan verifikasi gagal.
      AI tidak dapat digunakan dari sesi ini.
     </p>

    </div>
    `
   );

  }


  toast(
   "Kunci salah. Percobaan "+
   aiAttempts+
   "/5"
  );


 }catch(e){

  toast(
   "Server AI tidak tersedia."
  );

 }

};

async function ownerSha256(text){
 const data=new TextEncoder().encode(text);
 const hash=await crypto.subtle.digest("SHA-256",data);
 return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

window.verifyOwnerAccess=async()=>{
 const input=document.querySelector("#ownerAccessCode");
 const code=input?.value?.trim()||"";
 if(!code) return toast("Masukkan kode owner");
 const hash=await ownerSha256(code);
 const configuredHash=(typeof OWNER_CODE_HASH!=="undefined" ? OWNER_CODE_HASH : "");
 if(!configuredHash) return toast("Kode owner belum dikonfigurasi di file ini");
 if(hash!==configuredHash){
  if(input){input.value="";input.focus();}
  return toast("Kode owner salah");
 }
 ownerUnlocked=true;
 sessionStorage.setItem("jk_owner_access","1");
 closeM();
 toast("Akses owner aktif");
 adminPage();
};

window.saveProduct=async id=>{

 const priceList=
  getEl("xprices").value
   .split("\n")
   .map(x=>x.trim())
   .filter(Boolean)
   .map(line=>{

    const parts=
     line.split("|");

    return {
     name:parts[0]?.trim()||
      "Paket",
     price:+(
      parts[1]||0
     )
    };

   });


 const stockMin=Math.max(800,Number(getEl("xmin").value)||800);
 const stockMax=Math.max(stockMin,Number(getEl("xmax").value)||10000);
 if(!getEl("xn").value.trim()) return toast("Nama produk wajib diisi");
 const d={
  name:getEl("xn").value.trim(),
  category:getEl("xc").value.trim()||"Lainnya",
  price:Math.max(0,Number(getEl("xp").value)||0),
  oldPrice:Math.max(0,Number(getEl("xo").value)||0),
  stockMin,
  stockMax,

  badge:getEl("xb").value,

  image:
   getEl("xi").value||LOGO,

  description:
   getEl("xd").value,

  priceList:

   priceList.length
   ?
   priceList
   :
   [
    {
     name:"Harga normal",
     price:+getEl("xp").value||0
    }
   ],

  active:true,

  updatedAt:
   serverTimestamp()
 };


 try{

  if(id){

   await setDoc(
    doc(
     db,
     "products",
     id
    ),
    d,
    {
     merge:true
    }
   );

  }else{

   await addDoc(
    collection(
     db,
     "products"
    ),
    {
     ...d,
     createdAt:
      serverTimestamp()
    }
   );

  }


  toast(
   "Produk disimpan"
  );

  closeM();

  load();


 }catch(e){

  console.error(e);

  toast(
   "Gagal menyimpan produk"
  );

 }

};

function applyStoreBackground(url){
 const u=String(url||"").trim().replace(/"/g,"");
 if(u){
  document.body.style.backgroundImage=`linear-gradient(#050716aa,#050716aa),url("${u}"),radial-gradient(circle at 10% 10%,#ff00c822,transparent 30%),radial-gradient(circle at 90% 20%,#00e5ff1d,transparent 30%),radial-gradient(circle at 50% 90%,#8b5cf622,transparent 35%)`;
  document.body.style.backgroundSize="cover";
  document.body.style.backgroundAttachment="fixed";
 }else{
  document.body.style.backgroundImage="";
  document.body.style.backgroundSize="";
  document.body.style.backgroundAttachment="";
 }
}

async function loadSettings(){

<script>
// Hard guard: every fresh page load starts at the local formal login screen.
// No Firebase/session dependency is required for the storefront to render.
window.addEventListener("pageshow",()=>{
  // Do not use sessionStorage as an automatic login bypass. The current
  // page instance must have a user object created by a successful login.
  if(!window.user){
    document.body.classList.add("jk-locked");
    document.getElementById("jkAuthGate")?.classList.remove("hidden");
    document.getElementById("jkAuthGate")?.querySelector("#jkLoginEmail")?.focus();
  }
});
</script>

<script id="jk-auth-clock-script">
(function(){
  function updateJKAuthClock(){
    const t=document.getElementById("jkAuthClockTime");
    const d=document.getElementById("jkAuthClockDate");
    if(!t||!d)return false;
    const now=new Date();
    const p=n=>String(n).padStart(2,"0");
    t.textContent=p(now.getHours())+":"+p(now.getMinutes())+":"+p(now.getSeconds());
    try{
      d.textContent=new Intl.DateTimeFormat("id-ID",{
        weekday:"long",day:"2-digit",month:"long",year:"numeric"
      }).format(now);
    }catch(e){
      const hari=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
      const bulan=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
      d.textContent=hari[now.getDay()]+", "+p(now.getDate())+" "+bulan[now.getMonth()]+" "+now.getFullYear();
    }
    return true;
  }
  function startJKAuthClock(){
    if(updateJKAuthClock()) setInterval(updateJKAuthClock,1000);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",startJKAuthClock,{once:true});
  else startJKAuthClock();
  window.addEventListener("load",updateJKAuthClock,{once:true});
})();
</script>
